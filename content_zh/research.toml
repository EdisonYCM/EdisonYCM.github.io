[[items]]
title = "场景文字追踪"
subtitle = "南开大学周宇教授课题组"
date = "2025.08 - 至今"
content = "针对形变、模糊及结构细节丢失等难点，提出首个无检测场景文字追踪框架 **SymTrack**，并基于三个视频文字识别数据集构建专用评测基准。独立完成代码实现、消融实验、十余个近年 SOTA 模型复现、全量评测与论文写作，在三个基准上均刷新 SOTA。论文以独立一作身份被 **ICML 2026** 接收。[论文](https://arxiv.org/abs/2605.17270) · [代码](https://github.com/EdisonYCM/SymTrack)"
tags = ["场景文字追踪", "视觉目标追踪", "PyTorch", "ICML 2026"]

[[items]]
title = "视频文本编辑"
subtitle = "南开大学周宇教授课题组"
date = "2026.01 - 至今"
content = "针对字形渲染不准与背景畸变问题，基于 **Wan 2.2** 开发首个免训练视频文本编辑框架，引入频域引导字形注入与掩码轨迹保留机制，综合效果优于 VACE、FlowEdit、FlowAlign 等方案。主导构建包含真实与合成数据的 VTE 评测基准，复现多个前沿模型，并独立完成代码、消融实验及论文写作；一篇 **AAAI 2027** 论文在投。"
tags = ["视频编辑", "视频生成", "扩散模型", "Wan 2.2"]

[[items]]
title = "图像文本超分"
subtitle = "南开大学周宇教授课题组"
date = "2025.12 - 2026.06"
content = "针对语义先验引发的视觉幻觉问题，参与开发抗幻觉双分支扩散框架，引入三源证据门控模块，实现结构与语义的自适应协同，并在 CTR 与 Real-CE（×2/×4）设定下刷新 SOTA。参与代码实现、消融实验及论文撰写；论文以第二作者身份被 **ACM Multimedia 2026** 接收。"
tags = ["图像超分", "扩散模型", "场景文字", "ACM MM 2026"]

[[items]]
