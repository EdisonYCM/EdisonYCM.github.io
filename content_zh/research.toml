subtitle = "CCF 学生领航计划新芽训练营、南开大学程明明教授课题组"
date = "2025.09 - 2026.02"
content = "研究手写公式识别与表格解析，复现前沿模型，并独立完成 **TAMER（AAAI 2025）** 从 PyTorch 到 Jittor 的代码迁移与精度对齐；完成训练营并通过结业答辩。"
