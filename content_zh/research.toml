[[items]]
title = "统一视觉理解与生成"
subtitle = "浙江大学王文冠教授课题组"
date = "2026.05 - 至今"
content = "面向视觉理解（判别式）与生成之间的冲突，探索基于统一表征的理解生成一体化框架。通过统一建模不同形式的条件输入与条件输出，使单一模型同时具备目标检测、语义分割、深度估计等视觉理解与条件生成能力。"
tags = ["统一表征", "视觉理解", "视觉生成", "多任务学习"]
